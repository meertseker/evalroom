# Publishes the TypeScript package to npm when a typescript-v* tag is pushed.
# Requires a repository secret NPM_TOKEN (an npm granular publish token for evalroom).
# Provenance needs the id-token permission below. See docs/releasing.md.
name: Release (TypeScript)

on:
  push:
    tags: ["typescript-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: typescript/package-lock.json
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: test "typescript-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
