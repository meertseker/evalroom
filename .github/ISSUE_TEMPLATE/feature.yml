name: Feature request
description: Propose a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to decide or measure, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: API or CLI sketch. Note how it keeps the hard rules (no runtime dependencies, no database, no bare rates).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
