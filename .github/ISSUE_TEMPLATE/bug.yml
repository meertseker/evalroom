name: Bug report
description: Something computes or behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command or code you ran and its output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: For a statistics bug, include the value you expected and where it comes from (paper, textbook, other software).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest reviews / run / rubric data (or Inspect log) that shows the problem.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - Python (PyPI)
        - TypeScript (npm)
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: evalroom version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Runtime and OS
      placeholder: "Python 3.12 + inspect_ai 0.3.285, or Node 22.11; Ubuntu 24.04"
