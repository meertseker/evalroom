[project]
name = "evalroom"
version = "0.1.0"
description = "Judge and reviewer agreement with confidence intervals: multi-lens review, versioned rubrics, golden sets, gated regression runs, and an Inspect extension that checks your LLM judge against human edits."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mert Seker", email = "meertseker@gmail.com" }]
requires-python = ">=3.10"
keywords = [
    "llm",
    "evaluation",
    "evals",
    "llm-as-a-judge",
    "inspect-ai",
    "human-review",
    "inter-rater-agreement",
    "cohen-kappa",
    "fleiss-kappa",
    "wilson-interval",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
inspect = ["inspect_ai>=0.3.285; python_version >= '3.11'"]
pandas = ["pandas>=2"]

[project.urls]
Homepage = "https://github.com/meertseker/evalroom"
Documentation = "https://github.com/meertseker/evalroom/tree/main/docs"
Repository = "https://github.com/meertseker/evalroom"
Issues = "https://github.com/meertseker/evalroom/issues"
Changelog = "https://github.com/meertseker/evalroom/blob/main/CHANGELOG.md"

[project.scripts]
evalroom = "evalroom.cli:console_main"

[project.entry-points.inspect_ai]
evalroom = "evalroom.inspect._registry"

[dependency-groups]
dev = [
    "inspect_ai>=0.3.285; python_version >= '3.11'",
    "pandas>=2",
    "pandas-stubs>=2",
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalroom"]

[tool.hatch.build.targets.sdist]
include = ["src/evalroom", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "RET", "PL"]
ignore = [
    "PLR0911", # many returns mirror the decision tables in the docs
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004", # thresholds in statistics code are the point
    "PLR0917",
    "RUF001",  # the output uses typographic characters on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["evalroom._serde.optional", "evalroom._serde.renamed"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]
"examples/**" = ["PLC0415"]

[tool.mypy]
strict = true
python_version = "3.10"
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
